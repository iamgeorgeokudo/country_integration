apiVersion: apps/v1
kind: Deployment
metadata:
  name: country-integration
  labels:
    app: country-integration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: country-integration
  template:
    metadata:
      labels:
        app: country-integration
    spec:
      containers:
        - name: country-integration
          image: country-integration:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: country-integration-config
            - secretRef:
                name: country-integration-db
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
