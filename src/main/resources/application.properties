spring.application.name=country-integration

# Server
server.port=8085

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/country_integration?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:country_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator and observability
management.endpoints.web.exposure.include=health,info,metrics

# Health endpoint details
management.endpoint.health.show-details=never

# Kubernetes liveness and readiness probes
management.endpoint.health.probes.enabled=true

# Application information
management.info.env.enabled=false

# Logging
logging.level.com.ncba.countryintegration=INFO

# SOAP Country Information Service
soap.country-info.url=${SOAP_COUNTRY_INFO_URL:http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso}
soap.country-info.connect-timeout=${SOAP_CONNECT_TIMEOUT:5000}
soap.country-info.request-timeout=${SOAP_REQUEST_TIMEOUT:10000}